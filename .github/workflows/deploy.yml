name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Servidor de destino"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - testing

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Deploy a producción (prometheus, directo)
        if: github.event.inputs.environment == 'production'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          port: 22
          script_path: scripts/deploy.sh

      - name: Deploy a testing (vía túnel inverso por prometheus)
        if: github.event.inputs.environment == 'testing'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TESTING_HOST }}
          port: ${{ secrets.TESTING_PORT }}
          username: ${{ secrets.TESTING_USER }}
          key: ${{ secrets.TESTING_KEY }}
          fingerprint: ${{ secrets.TESTING_HOST_FINGERPRINT }}
          proxy_host: ${{ secrets.PROXY_HOST }}
          proxy_port: 22
          proxy_username: ${{ secrets.PROXY_USER }}
          proxy_key: ${{ secrets.PROXY_KEY }}
          proxy_fingerprint: ${{ secrets.PROXY_HOST_FINGERPRINT }}
          script_path: scripts/deploy.sh
