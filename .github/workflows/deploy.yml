name: Deploy

on:
  # Deploy automático: al pushear a main queda desplegado solo, siempre que el
  # CI (tsc del backend + build del frontend) haya pasado. Antes había que
  # dispararlo a mano desde Actions y era fácil olvidarlo: el fix quedaba en
  # main pero el servidor seguía con el código viejo.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Deploy manual: sirve para re-desplegar sin cambios de código o para un
  # rollback puntual, y no queda atado al resultado del CI.
  workflow_dispatch:
    inputs:
      environment:
        description: "Servidor de destino"
        required: true
        default: "production"
        type: choice
        options:
          - production
          # testing se actualiza solo vía scripts/auto-deploy.sh (modelo pull, sin túnel)

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a producción (prometheus)
    # workflow_run se dispara con CUALQUIER conclusión del CI (success, failure,
    # cancelled), así que acá se filtra: solo se despliega si terminó bien. Un
    # CI cancelado lo está reemplazando el push siguiente, que hará su deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Runner self-hosted dentro de Prometheus (pm2 `github-runner`). El puerto 22
    # ya no está publicado a Internet, así que el deploy por SSH (appleboy) no
    # puede conectar: el runner sale por HTTPS y ejecuta el deploy localmente.
    runs-on: [self-hosted, prometheus]
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar deploy.sh en Prometheus
        run: bash scripts/deploy.sh
