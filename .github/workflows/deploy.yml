name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Servidor de destino"
        required: true
        default: "production"
        type: choice
        options:
          - production
          # testing se actualiza solo vía scripts/auto-deploy.sh (modelo pull, sin túnel)

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a producción (prometheus)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar deploy en el servidor
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          port: 22
          script_path: scripts/deploy.sh
