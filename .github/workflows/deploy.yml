name: Deploy

on:
  # Deploy automático: al pushear a main queda desplegado solo, siempre que el
  # CI (tsc del backend + build del frontend) haya pasado.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Deploy manual: sirve para re-desplegar sin cambios de código o para un
  # rollback puntual, y no queda atado al resultado del CI.
  workflow_dispatch:
    inputs:
      environment:
        description: "Servidor de destino"
        required: true
        default: "production"
        type: choice
        options:
          - production

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a producción (pressticket)
    # workflow_run se dispara con CUALQUIER conclusión del CI (success, failure,
    # cancelled), así que acá se filtra: solo se despliega si terminó bien. Un
    # CI cancelado lo está reemplazando el push siguiente, que hará su deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Runner self-hosted dentro de pressticket (pm2 `github-runner`).
    # pressticket está bajo CGNAT y no tiene puertos entrantes: Actions no puede
    # entrar por SSH (appleboy), así que el runner sale por HTTPS y ejecuta el
    # deploy localmente. No hace falta checkout: el deploy trabaja sobre
    # /home/deploy/proit-press, no sobre el workspace del runner.
    runs-on: [self-hosted, pressticket]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Aplicar origin/main en pressticket
        # /home/deploy/.autodeploy/auto-deploy.sh hace git fetch de main, compara
        # el SHA con .last-deployed y, si cambió, ejecuta deploy.sh (dependencias,
        # parches de whatsapp-web.js, tsc, migraciones, build atómico del panel y
        # reinicio de proit-back / proit-front). Solo marca el SHA si terminó
        # bien. Tiene flock: si el cron de 3 minutos está corriendo, sale sin
        # hacer nada; si ya desplegó ese commit, este paso también es no-op.
        run: |
          if [ -f /home/deploy/proit-press/.autodeploy-off ]; then
            echo "Auto-deploy pausado (.autodeploy-off presente): no se despliega."
            exit 0
          fi
          # Las mismas variables que usa la línea de cron. Sin ellas el script
          # deduce el repo de su propia ruta (su padre es /home/deploy) y muere
          # en `git fetch` con "not a git repository".
          AUTODEPLOY_REPO=/home/deploy/proit-press \
          AUTODEPLOY_BRANCH=main \
          AUTODEPLOY_DEPLOY=/home/deploy/.autodeploy/deploy.sh \
          /home/deploy/.autodeploy/auto-deploy.sh
